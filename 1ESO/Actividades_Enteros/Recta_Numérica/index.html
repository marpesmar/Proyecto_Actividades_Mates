<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coloca cada número en su lugar</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Segoe UI,Arial,sans-serif;
background:linear-gradient(135deg,#e8f4ff,#f6fbff);
color:#1f2937;
}

.screen{
display:none;
padding:20px;
max-width:1400px;
margin:auto;
min-height:100vh;
}

.screen.active{
display:block;
}

h1,h2{
text-align:center;
margin:10px 0;
}

.subtitle{
text-align:center;
font-size:1rem;
margin-bottom:15px;
color:#374151;
}

.card{
background:white;
border-radius:18px;
padding:20px;
box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.btn{
background:#2563eb;
color:white;
border:none;
padding:14px 24px;
border-radius:12px;
cursor:pointer;
font-size:1rem;
font-weight:700;
margin:10px;
transition:.3s;
}

.btn:hover{
transform:translateY(-2px);
background:#1d4ed8;
}

.btn-green{
background:#16a34a;
}
.btn-orange{
background:#ea580c;
}
.btn-purple{
background:#7c3aed;
}

.center{
text-align:center;
}

.score{
font-size:1.2rem;
font-weight:bold;
text-align:center;
margin:15px 0;
}

.draggables{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin:20px 0;
}

.drag-number{
background:#2563eb;
color:white;
padding:12px 18px;
border-radius:10px;
cursor:grab;
font-weight:bold;
user-select:none;
font-size:1.1rem;
}

.drag-number.used{
opacity:.45;
}

.number-line{
overflow-x:auto;
padding:20px 0;
}

.line-wrapper{
min-width:1250px;
position:relative;
height:180px;
}

.main-line{
position:absolute;
left:0;
right:0;
top:110px;
height:4px;
background:#111827;
}

.tick{
position:absolute;
top:95px;
width:2px;
height:30px;
background:#111827;
}

.label{
position:absolute;
top:125px;
left:-8px;
font-weight:bold;
color:#dc2626;
}

.dropzone{
position:absolute;
top:42px;
width:32px;
height:32px;
border:2px dashed #94a3b8;
border-radius:8px;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:.95rem;
}

.dropzone.correct{
background:#dcfce7;
border-color:#16a34a;
}

.dropzone.wrong{
background:#fee2e2;
border-color:#dc2626;
}

.feedback{
margin-top:15px;
font-size:1rem;
font-weight:600;
text-align:center;
}

.question{
background:white;
border-radius:14px;
padding:15px;
margin:12px 0;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.question input{
width:120px;
padding:10px;
font-size:1rem;
text-align:center;
margin-left:10px;
}

.result{
margin-top:10px;
font-weight:bold;
}

.visual{
margin-top:10px;
padding:8px;
background:#eff6ff;
border-radius:8px;
font-size:.95rem;
}

.challenge{
font-size:1.15rem;
line-height:1.8;
}

.final-box{
background:white;
border-radius:18px;
padding:25px;
box-shadow:0 6px 18px rgba(0,0,0,.12);
max-width:800px;
margin:auto;
text-align:center;
}

.big-score{
font-size:2rem;
font-weight:bold;
margin:15px 0;
color:#2563eb;
}

@media(max-width:768px){
h1{font-size:1.5rem}
.question input{width:90px}
.btn{width:100%;margin:8px 0}
}
</style>
</head>
<body>

<!-- PANTALLA 1 -->
<section id="screen1" class="screen active">
<h1>🎯 Coloca cada número en su lugar</h1>
<div class="subtitle">Arrastra cada número hasta su posición correcta en la recta numérica.</div>

<div class="card">

<div class="draggables" id="draggables"></div>

<div class="number-line">
<div class="line-wrapper" id="lineWrapper">
<div class="main-line"></div>
</div>
</div>

<div class="center">
<button class="btn btn-green" onclick="checkPart1()">Comprobar</button>
</div>

<div id="feedback1" class="feedback"></div>

<div class="center">
<button id="toScreen2" class="btn" style="display:none" onclick="showScreen(2)">
Continuar a desplazamientos →
</button>
</div>

</div>
</section>

<!-- PANTALLA 2 -->
<section id="screen2" class="screen">
<h2>➡️ Parte 2. Desplazamientos en la recta numérica</h2>

<div class="card">
<div id="questionsContainer"></div>

<div class="center">
<button class="btn btn-green" onclick="checkPart2()">Comprobar respuestas</button>
</div>

<div id="part2Result" class="feedback"></div>

<div class="center">
<button id="toScreen3" class="btn" style="display:none" onclick="showScreen(3)">
Ir al reto final →
</button>
</div>
</div>
</section>

<!-- PANTALLA 3 -->
<section id="screen3" class="screen">
<h2>🏆 Reto final</h2>

<div class="card">

<div id="challengeText" class="challenge"></div>

<div style="text-align:center;margin:15px 0;">
<input type="number" id="challengeAnswer" style="padding:10px;font-size:1.1rem;width:120px;text-align:center;">
</div>

<div class="center">
<button class="btn btn-purple" onclick="checkChallenge()">Comprobar reto</button>
</div>

<div id="challengeFeedback" class="feedback"></div>

</div>
</section>

<!-- FINAL -->
<section id="screen4" class="screen">
<div class="final-box">

<h2>📊 Resultados finales</h2>

<div id="finalStats"></div>

<div class="big-score" id="finalPercent"></div>

<div id="finalMessage"></div>

<button class="btn btn-orange" onclick="newGame()">
🔄 Jugar otra partida
</button>

</div>
</section>

<script>

let numbers=[];
let selectedDrops={};

let questions=[];
let challenge={};

let totalQuestions=11;
let correctAnswers=0;

const MIN=-15;
const MAX=15;

function randomInt(a,b){
return Math.floor(Math.random()*(b-a+1))+a;
}

function sign(n){
return n>0?`+${n}`:n.toString();
}

function showScreen(n){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("screen"+n).classList.add("active");
}

function generateNumbers(){
const set=new Set();

while(set.size<5){
let n=randomInt(-10,10);
if(n!==0) set.add(n);
}

return [...set];
}

function buildLine(){

const wrapper=document.getElementById("lineWrapper");
wrapper.innerHTML='<div class="main-line"></div>';

const step=40;

for(let n=MIN;n<=MAX;n++){

const left=(n-MIN)*step;

const tick=document.createElement("div");
tick.className='tick';
tick.style.left=left+'px';

wrapper.appendChild(tick);

if(n===0){
const lbl=document.createElement("div");
lbl.className='label';
lbl.innerText='0';
lbl.style.left=(left-5)+'px';
wrapper.appendChild(lbl);
}else{

const dz=document.createElement("div");
dz.className='dropzone';
dz.dataset.value=n;
dz.style.left=(left-15)+'px';

dz.addEventListener("dragover",e=>e.preventDefault());

dz.addEventListener("drop",e=>{
e.preventDefault();

const value=e.dataTransfer.getData("text");
dz.innerText=value;
dz.dataset.placed=value;

selectedDrops[value]=dz.dataset.value;
});

wrapper.appendChild(dz);
}
}
}

function buildNumbers(){
const container=document.getElementById("draggables");
container.innerHTML='';

numbers.forEach(n=>{

let d=document.createElement("div");
d.className='drag-number';
d.draggable=true;
d.innerText=sign(n);

d.addEventListener("dragstart",e=>{
e.dataTransfer.setData("text",n);
});

container.appendChild(d);

});
}

function checkPart1(){

let correct=0;
let hints=[];

document.querySelectorAll(".dropzone").forEach(z=>{

z.classList.remove("correct","wrong");

const placed=z.dataset.placed;

if(placed!==undefined){

if(Number(placed)===Number(z.dataset.value)){
z.classList.add("correct");
correct++;
}else{
z.classList.add("wrong");

if(Number(placed)>Number(z.dataset.value)){
hints.push(`${sign(Number(placed))} debe ir más a la izquierda.`);
}else{
hints.push(`${sign(Number(placed))} debe ir más a la derecha.`);
}
}
}
});

correctAnswers+=correct;

document.getElementById("feedback1").innerHTML=
`✅ Aciertos: ${correct}/5<br>
${hints.length?'<br>💡 '+hints.slice(0,3).join('<br>'):''}`;

document.getElementById("toScreen2").style.display='inline-block';
}

function generateQuestions(){

questions=[];

for(let i=0;i<5;i++){

let start=randomInt(-10,10);
let move=randomInt(2,8);
let direction=Math.random()<0.5?'right':'left';

let result=direction==='right'
?start+move
:start-move;

questions.push({
start,
move,
direction,
result
});
}
}

function buildQuestions(){

const c=document.getElementById("questionsContainer");
c.innerHTML='';

questions.forEach((q,index)=>{

let txt=
q.direction==='right'
?`Si estamos en ${sign(q.start)} y avanzamos ${q.move} posiciones hacia la derecha, ¿a qué número llegamos?`
:`Si estamos en ${sign(q.start)} y retrocedemos ${q.move} posiciones hacia la izquierda, ¿dónde terminamos?`;

c.innerHTML+=`
<div class="question">
<strong>${index+1}. ${txt}</strong><br><br>
Respuesta:
<input type="number" id="q${index}">
<div id="r${index}" class="result"></div>
<div id="v${index}" class="visual"></div>
</div>
`;
});
}

function checkPart2(){

let correct=0;

questions.forEach((q,i)=>{

const val=Number(document.getElementById("q"+i).value);

let r=document.getElementById("r"+i);
let v=document.getElementById("v"+i);

if(val===q.result){

r.innerHTML="✅ Correcto";
r.style.color="green";
correct++;

}else{

r.innerHTML=`❌ Incorrecto. Resultado: ${sign(q.result)}`;
r.style.color="red";
}

v.innerHTML=
q.direction==='right'
?`${sign(q.start)} → ${sign(q.result)} (avance de ${q.move})`
:`${sign(q.start)} → ${sign(q.result)} (retroceso de ${q.move})`;

});

correctAnswers+=correct;

document.getElementById("part2Result").innerHTML=
`Has acertado ${correct} de 5 preguntas.`;

document.getElementById("toScreen3").style.display='inline-block';
}

function generateChallenge(){

let start=randomInt(-8,8);

let a=randomInt(2,7);
let b=randomInt(2,6);
let c=randomInt(2,7);

let final=start+a-b+c;

challenge={
start,a,b,c,final
};
}

function buildChallenge(){

document.getElementById("challengeText").innerHTML=`
Comenzamos en <strong>${sign(challenge.start)}</strong>.<br><br>

1️⃣ Avanza <strong>${challenge.a}</strong> posiciones.<br>
2️⃣ Retrocede <strong>${challenge.b}</strong> posiciones.<br>
3️⃣ Avanza <strong>${challenge.c}</strong> posiciones.<br><br>

<strong>¿En qué número terminas?</strong>
`;
}

function checkChallenge(){

const val=Number(document.getElementById("challengeAnswer").value);

let fb=document.getElementById("challengeFeedback");

let p1=challenge.start+challenge.a;
let p2=p1-challenge.b;
let p3=p2+challenge.c;

if(val===challenge.final){
correctAnswers++;
fb.innerHTML=`✅ Correcto.<br><br>
${sign(challenge.start)} → ${sign(p1)} → ${sign(p2)} → ${sign(p3)}
`;
}else{
fb.innerHTML=`❌ Incorrecto.<br><br>
Paso 1: ${sign(challenge.start)} + ${challenge.a} = ${sign(p1)}<br>
Paso 2: ${sign(p1)} - ${challenge.b} = ${sign(p2)}<br>
Paso 3: ${sign(p2)} + ${challenge.c} = ${sign(p3)}
`;
}

setTimeout(showFinalResults,1200);
}

function showFinalResults(){

showScreen(4);

let percent=Math.round((correctAnswers/totalQuestions)*100);

let msg="";

if(percent>=90){
msg="🌟 Excelente. Dominas muy bien la recta numérica.";
}
else if(percent>=70){
msg="👏 Buen trabajo. Sigue avanzando.";
}
else if(percent>=50){
msg="📘 Sigue practicando para ganar seguridad.";
}
else{
msg="🔁 Repasa la recta numérica y vuelve a intentarlo.";
}

document.getElementById("finalStats").innerHTML=
`<strong>Respuestas correctas:</strong> ${correctAnswers} de ${totalQuestions}`;

document.getElementById("finalPercent").innerHTML=
percent+" %";

document.getElementById("finalMessage").innerHTML=
msg;
}

function newGame(){

correctAnswers=0;
selectedDrops={};

numbers=generateNumbers();
generateQuestions();
generateChallenge();

buildLine();
buildNumbers();
buildQuestions();
buildChallenge();

document.getElementById("feedback1").innerHTML='';
document.getElementById("part2Result").innerHTML='';
document.getElementById("challengeFeedback").innerHTML='';

document.getElementById("toScreen2").style.display='none';
document.getElementById("toScreen3").style.display='none';

showScreen(1);
}

newGame();
</script>
</body>
</html>
