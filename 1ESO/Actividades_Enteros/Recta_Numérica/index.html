<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coloca cada número en su lugar</title>
<style>
:root{
    --primary:#2563eb;
    --secondary:#0ea5e9;
    --success:#16a34a;
    --danger:#dc2626;
    --warning:#f59e0b;
    --bg:#f3f6fb;
    --card:#ffffff;
    --text:#1f2937;
}
*{box-sizing:border-box;}
body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}
.container{
    width:100%;
    min-height:100vh;
    padding:18px;
}
h1{
    text-align:center;
    margin:0;
    color:var(--primary);
}
.subtitle{
    text-align:center;
    margin:8px 0 20px;
}
.panel{
    background:var(--card);
    border-radius:18px;
    padding:20px;
    max-width:1200px;
    margin:auto;
    box-shadow:0 4px 18px rgba(0,0,0,.1);
}
.screen{
    display:none;
}
.screen.active{
    display:block;
}
.scoreBox{
    text-align:center;
    font-weight:bold;
    font-size:1.1rem;
    margin-bottom:15px;
}
.cards{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    margin-bottom:20px;
}
.number-card{
    background:var(--primary);
    color:white;
    padding:12px 18px;
    border-radius:12px;
    font-size:1.2rem;
    cursor:grab;
    user-select:none;
    min-width:70px;
    text-align:center;
    font-weight:bold;
}
.number-card.used{
    opacity:.35;
}
.line-container{
    width:100%;
    overflow-x:auto;
    padding-bottom:10px;
}
.number-line{
    position:relative;
    width:100%;
    min-width:900px;
    height:110px;
    margin:30px auto;
}
.base-line{
    position:absolute;
    left:2%;
    right:2%;
    top:55px;
    height:4px;
    background:#333;
}
.tick{
    position:absolute;
    top:40px;
    width:2px;
    height:30px;
    background:#444;
}
.tick-label{
    position:absolute;
    top:74px;
    font-size:.8rem;
    transform:translateX(-50%);
}
.dropzone{
    position:absolute;
    top:0;
    width:28px;
    height:35px;
    transform:translateX(-50%);
    border:2px dashed #cbd5e1;
    border-radius:10px;
}
.dropzone.correct{
    background:#dcfce7;
    border-color:var(--success);
}
.dropzone.error{
    background:#fee2e2;
    border-color:var(--danger);
}
.dropzone .placed{
    font-weight:bold;
    text-align:center;
    line-height:30px;
}
.btn{
    border:none;
    padding:12px 22px;
    border-radius:12px;
    cursor:pointer;
    font-size:1rem;
    font-weight:bold;
    margin:6px;
}
.primary{background:var(--primary);color:white;}
.success{background:var(--success);color:white;}
.warning{background:var(--warning);color:white;}
.center{text-align:center;}
.feedback{
    margin-top:14px;
    text-align:center;
    font-weight:bold;
}
.question{
    background:#eef3ff;
    border-left:5px solid var(--primary);
    margin:12px 0;
    padding:12px;
    border-radius:10px;
}
.question input{
    padding:8px;
    width:100px;
    font-size:1rem;
}
.result{
    margin-top:8px;
}
.correctText{color:var(--success);font-weight:bold;}
.errorText{color:var(--danger);font-weight:bold;}
.visual{
    margin-top:6px;
    font-size:.95rem;
}
.challenge{
    font-size:1.1rem;
    line-height:1.8;
}
.summary{
    text-align:center;
    font-size:1.2rem;
}
.finalBox{
    background:#eef8ff;
    padding:18px;
    border-radius:16px;
}
@media(max-width:800px){
    .number-line{
        min-width:780px;
    }
    .question input{
        width:80px;
    }
}
</style>
</head>
<body>

<div class="container">

<div class="panel">

<h1>Coloca cada número en su lugar</h1>
<div class="subtitle">
Matemáticas 1.º ESO · Números enteros · Recta numérica
</div>

<div class="scoreBox" id="scoreDisplay">Puntuación: 0</div>

<!-- PANTALLA 1 -->
<section class="screen active" id="screen1">

<h2>Parte 1. Colocación en la recta numérica</h2>

<div class="cards" id="cards"></div>

<div class="line-container">
<div class="number-line" id="line"></div>
</div>

<div class="center">
<button class="btn success" onclick="checkPlacement()">Comprobar</button>
</div>

<div id="placementFeedback" class="feedback"></div>

<div class="center">
<button class="btn primary" id="toScreen2" style="display:none;" onclick="goScreen(2)">
Ir a la Parte 2
</button>
</div>

</section>

<!-- PANTALLA 2 -->
<section class="screen" id="screen2">

<h2>Parte 2. Desplazamientos en la recta numérica</h2>

<div id="questionsContainer"></div>

<div class="center">
<button class="btn success" onclick="checkQuestions()">Comprobar respuestas</button>
</div>

<div class="center">
<button class="btn primary" id="toScreen3" style="display:none;" onclick="goScreen(3)">
Ir al Reto Final
</button>
</div>

</section>

<!-- PANTALLA 3 -->
<section class="screen" id="screen3">

<h2>Parte 3. Reto final</h2>

<div id="challengeArea"></div>

<div class="center">
<button class="btn success" onclick="checkChallenge()">
Comprobar reto
</button>
</div>

<div id="challengeFeedback"></div>

<div id="finalSummary" style="display:none;"></div>

</section>

</div>
</div>

<script>

let game={};
let score=0;
let totalQuestions=11;

function updateScore(){
    document.getElementById("scoreDisplay").textContent="Puntuación: "+score;
}

function randomInt(a,b){
    return Math.floor(Math.random()*(b-a+1))+a;
}

function signed(n){
    if(n>0) return "+"+n;
    return n.toString();
}

function generateUniqueNumbers(){
    let set=new Set();
    while(set.size<5){
        set.add(randomInt(-10,10));
    }
    return [...set];
}

function startGame(){

score=0;
updateScore();

game={};
game.numbers=generateUniqueNumbers();

createNumberLine();
createQuestions();
createChallenge();

document.getElementById("placementFeedback").innerHTML="";
document.getElementById("toScreen2").style.display="none";
document.getElementById("toScreen3").style.display="none";
document.getElementById("finalSummary").style.display="none";

goScreen(1);

}

function goScreen(n){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById("screen"+n).classList.add("active");
}

/* --------------------- PANTALLA 1 --------------------- */

function createNumberLine(){

const cards=document.getElementById("cards");
cards.innerHTML="";

const line=document.getElementById("line");
line.innerHTML='<div class="base-line"></div>';

for(let i=-15;i<=15;i++){

let pos=((i+15)/30)*96+2;

let tick=document.createElement("div");
tick.className="tick";
tick.style.left=pos+"%";
line.appendChild(tick);

let label=document.createElement("div");
label.className="tick-label";
label.style.left=pos+"%";
label.textContent=i;
line.appendChild(label);

let zone=document.createElement("div");
zone.className="dropzone";
zone.dataset.value=i;
zone.style.left=pos+"%";

zone.addEventListener("dragover",e=>e.preventDefault());

zone.addEventListener("drop",e=>{
e.preventDefault();

let value=e.dataTransfer.getData("text");
zone.innerHTML='<div class="placed">'+value+'</div>';
zone.dataset.placed=value;

document.querySelectorAll(".number-card").forEach(c=>{
if(c.dataset.value===value){
c.classList.add("used");
}
});
});

line.appendChild(zone);
}

game.numbers.forEach(n=>{

let card=document.createElement("div");
card.className="number-card";
card.draggable=true;
card.dataset.value=n;
card.textContent=signed(n);

card.addEventListener("dragstart",e=>{
e.dataTransfer.setData("text",n);
});

cards.appendChild(card);

});

}

function checkPlacement(){

let hits=0;
let feedback=[];

document.querySelectorAll(".dropzone").forEach(z=>{

z.classList.remove("correct");
z.classList.remove("error");

if(z.dataset.placed!==undefined){

let placed=parseInt(z.dataset.placed);
let correct=parseInt(z.dataset.value);

if(placed===correct){
z.classList.add("correct");
hits++;
}else{
z.classList.add("error");
feedback.push(
"El número "+signed(placed)+" está mal situado. Recuerda que cuanto más negativo sea un número, más a la izquierda se coloca."
);
}
}

});

score+=hits;
updateScore();

let text="Aciertos: "+hits+" de 5.<br>";

if(feedback.length){
text+="<br>"+feedback[0];
}else{
text+="<span class='correctText'>¡Fantástico! Has colocado todos los números correctamente.</span>";
}

document.getElementById("placementFeedback").innerHTML=text;

document.getElementById("toScreen2").style.display="inline-block";
}

/* --------------------- PANTALLA 2 --------------------- */

function createQuestions(){

const container=document.getElementById("questionsContainer");
container.innerHTML="";
game.questions=[];

for(let i=0;i<5;i++){

let start=randomInt(-10,10);
let move=randomInt(2,8);

let direction=Math.random()<0.5?"right":"left";

let end=direction==="right" ? start+move : start-move;

let q={
start,move,direction,end
};

game.questions.push(q);

let div=document.createElement("div");
div.className="question";

let text=direction==="right"
?`Si estamos en ${signed(start)} y avanzamos ${move} posiciones hacia la derecha, ¿a qué número llegamos?`
:`Si estamos en ${signed(start)} y retrocedemos ${move} posiciones hacia la izquierda, ¿dónde terminamos?`;

div.innerHTML=`
<div>${i+1}. ${text}</div>
<div style="margin-top:10px;">
Respuesta:
<input type="number" id="q${i}">
</div>
<div class="result" id="r${i}"></div>
`;

container.appendChild(div);
}

}

function checkQuestions(){

let localHits=0;

game.questions.forEach((q,i)=>{

let response=parseInt(document.getElementById("q"+i).value);

let box=document.getElementById("r"+i);

let visual = q.direction==="right"
? `${signed(q.start)} → ${signed(q.end)} (avanzas ${q.move})`
: `${signed(q.start)} → ${signed(q.end)} (retrocedes ${q.move})`;

if(response===q.end){

localHits++;
box.innerHTML=
'<span class="correctText">✔ Correcto</span>' +
'<div class="visual">'+visual+'</div>';

}else{

box.innerHTML=
'<span class="errorText">✘ Incorrecto. Resultado: '+signed(q.end)+'</span>'+
'<div class="visual">'+visual+'</div>';

}

});

score+=localHits;
updateScore();

document.getElementById("toScreen3").style.display="inline-block";
}

/* --------------------- PANTALLA 3 --------------------- */

function createChallenge(){

let start=randomInt(-10,10);

let m1=randomInt(2,8);
let m2=randomInt(2,8);
let m3=randomInt(2,8);

let result=start+m1-m2+m3;

game.challenge={start,m1,m2,m3,result};

document.getElementById("challengeArea").innerHTML=`
<div class="challenge">
<p><strong>Comenzamos en ${signed(start)}</strong></p>

<ol>
<li>Avanza ${m1} posiciones.</li>
<li>Retrocede ${m2} posiciones.</li>
<li>Avanza ${m3} posiciones.</li>
</ol>

<p>¿En qué número terminas?</p>

<input type="number" id="challengeAnswer">

</div>
`;
}

function checkChallenge(){

let answer=parseInt(
document.getElementById("challengeAnswer").value
);

let c=game.challenge;

let step1=c.start+c.m1;
let step2=step1-c.m2;
let step3=step2+c.m3;

let html="";

if(answer===c.result){
score++;
updateScore();
html+='<p class="correctText">✔ Correcto</p>';
}else{
html+='<p class="errorText">✘ Incorrecto. Resultado: '+signed(c.result)+'</p>';
}

html+=`
<h3>Explicación paso a paso</h3>

<p>${signed(c.start)} + ${c.m1} = ${signed(step1)}</p>
<p>${signed(step1)} - ${c.m2} = ${signed(step2)}</p>
<p>${signed(step2)} + ${c.m3} = ${signed(step3)}</p>
`;

document.getElementById("challengeFeedback").innerHTML=html;

showFinalSummary();
}

function showFinalSummary(){

let percent=Math.round((score/11)*100);

let msg="";

if(percent>=90){
msg="🏆 Excelente";
}else if(percent>=70){
msg="👏 Buen trabajo";
}else if(percent>=50){
msg="📘 Sigue practicando";
}else{
msg="🔁 Repasa la recta numérica y vuelve a intentarlo";
}

document.getElementById("finalSummary").style.display="block";

document.getElementById("finalSummary").innerHTML=`
<div class="finalBox">

<h2>Evaluación final</h2>

<div class="summary">

<p><strong>Respuestas correctas:</strong> ${score} de 11</p>

<p><strong>Porcentaje de éxito:</strong> ${percent}%</p>

<p><strong>${msg}</strong></p>

<button class="btn warning" onclick="startGame()">
🎮 Jugar otra partida
</button>

</div>

</div>
`;
}

startGame();

</script>

</body>
</html>
