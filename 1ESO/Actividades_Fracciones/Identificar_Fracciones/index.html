<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>¿Qué fracción soy?</title>
<style>
:root{--ink:#17324d;--blue:#4361ee;--cyan:#4cc9f0;--pink:#f72585;--yellow:#ffd166;--green:#2fb344;--orange:#f08c00;--paper:#fff;--muted:#64748b;--shadow:0 16px 40px #25385822}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#fff7cc 0 12%,transparent 13%),radial-gradient(circle at 90% 15%,#d8f5ff 0 13%,transparent 14%),linear-gradient(145deg,#f7fbff,#fdf6ff)}
button{font:inherit}.app{width:min(1080px,100%);margin:auto;padding:20px}.screen{display:none;animation:fade .3s ease}.screen.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.card{background:#fffc;border:1px solid #fff;border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(8px);padding:clamp(18px,4vw,36px)}
.hero{text-align:center}.hero h1{font-size:clamp(2.2rem,7vw,4.8rem);margin:.1em 0;color:var(--blue);letter-spacing:-.04em}.hero p{font-size:clamp(1rem,2.7vw,1.35rem);margin:.2em 0 1em;color:#52657a}.cover{height:190px;margin:6px auto 28px;max-width:620px;overflow:hidden;display:grid;place-items:center}.cover svg{display:block;width:100%;height:100%;max-height:190px}.buttons{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.btn{border:0;border-radius:18px;padding:15px 22px;cursor:pointer;font-weight:800;box-shadow:0 8px 0 #0002;transition:.15s transform,.15s filter;min-height:52px}.btn:hover{filter:brightness(1.04);transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 4px 0 #0002}.btn:focus-visible,.key:focus-visible{outline:4px solid #1118;outline-offset:3px}.basic{background:var(--cyan);color:#07334a}.advanced{background:var(--pink);color:white}.secondary{background:#e9eef6;color:var(--ink)}.primary{background:var(--blue);color:white}.next{background:var(--yellow);color:#5c3b00}
.topbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap}.pill{background:white;border-radius:999px;padding:9px 14px;font-weight:800}.progress{height:14px;background:#e5eaf1;border-radius:999px;overflow:hidden;flex:1;min-width:160px}.progress>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .3s}
.gamegrid{display:grid;grid-template-columns:minmax(270px,1.3fr) minmax(270px,.8fr);gap:22px}.figurebox{min-height:380px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#f4f8ff);border-radius:24px;border:3px dashed #cad7e6;padding:14px}.figurebox svg{width:100%;max-height:360px}.panel{text-align:center}.panel h2{font-size:clamp(1.5rem,4vw,2.2rem);margin:.2em}.fraction{display:inline-grid;grid-template-rows:auto 5px auto;gap:7px;width:105px;margin:6px auto 14px}.slot{height:58px;border:3px solid #b7c4d3;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:2rem;font-weight:900;overflow:hidden}.slot.active{border-color:var(--blue);box-shadow:0 0 0 5px #4361ee24}.bar{background:var(--ink);border-radius:4px}.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:330px;margin:auto}.key{border:0;border-radius:13px;min-height:48px;background:#fff;box-shadow:0 4px 0 #d5dce7;font-weight:900;font-size:1.2rem;cursor:pointer}.key.arrow{background:#dfe6ff;color:#263da2}.key.clear{background:#ffe0e0;color:#9b1c1c}.check{grid-column:1/-1;margin-top:7px}.feedback{min-height:54px;margin:14px 0 4px;font-size:1.08rem;font-weight:900}.feedback.ok{color:var(--green)}.feedback.bad{color:var(--orange)}
.results h1{text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{padding:18px;border-radius:20px;text-align:center;background:#f0f5ff}.stat strong{display:block;font-size:2rem}.result-list{display:grid;gap:10px}.result-row{display:grid;grid-template-columns:80px 1fr 1fr 1fr;gap:8px;align-items:center;background:#f7f9fc;border-radius:16px;padding:8px}.thumb svg{width:70px;height:56px}.good{color:var(--green);font-weight:900}.wrong{color:#d9480f;font-weight:900}.motivation{text-align:center;font-size:1.2rem;font-weight:800;color:var(--blue)}
@media(max-width:720px){.gamegrid{grid-template-columns:1fr}.figurebox{min-height:280px}.result-row{grid-template-columns:62px 1fr 1fr}.result-row .status{grid-column:2/-1}.stats{grid-template-columns:1fr}.app{padding:10px}.card{border-radius:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="app">
<section id="home" class="screen active"><div class="card hero"><div id="cover" class="cover" aria-hidden="true"></div><h1>¿Qué fracción soy?</h1><p>Demuestra que eres un experto identificando fracciones</p><div class="buttons"><button class="btn basic" data-level="basic">Nivel básico</button><button class="btn advanced" data-level="advanced">Nivel avanzado</button></div></div></section>
<section id="game" class="screen"><div class="topbar"><button id="quit" class="btn secondary">← Inicio</button><span id="levelPill" class="pill"></span><div class="progress" aria-label="Progreso"><div id="progressBar"></div></div><span id="scorePill" class="pill"></span></div><div class="card gamegrid"><div id="figure" class="figurebox" aria-label="Representación gráfica de una fracción"></div><div class="panel"><h2>¿Qué fracción soy?</h2><p id="instruction">Introduce numerador y denominador</p><div class="fraction" aria-label="Respuesta"><div id="numSlot" class="slot active">&nbsp;</div><div class="bar"></div><div id="denSlot" class="slot">&nbsp;</div></div><div id="keypad" class="keypad"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="btn next" hidden>Siguiente fracción →</button></div></div></section>
<section id="results" class="screen"><div class="card results"><h1>Resultados</h1><p id="motivation" class="motivation"></p><div class="stats"><div class="stat"><strong id="hits">0</strong>Aciertos</div><div class="stat"><strong id="errors">0</strong>Errores</div><div class="stat"><strong id="percent">0%</strong>Éxito</div></div><div id="resultList" class="result-list"></div><div class="buttons" style="margin-top:20px"><button id="replay" class="btn primary">Jugar de nuevo</button><button id="other" class="btn advanced">Elegir otro nivel</button><button id="homeBtn" class="btn secondary">Volver al inicio</button></div></div></section>
</main>
<script>
'use strict';
// Configuración visual: la portada se genera como SVG por la función indicada.
const CONFIG={coverRenderer:'renderCover',colors:{fill:'#4361ee',empty:'#e8eef7',line:'#17324d'}};
const $=s=>document.querySelector(s), NS='http://www.w3.org/2000/svg';
const state={level:null,exercises:[],index:0,score:0,errors:0,answer:{numerator:'',denominator:''},active:'numerator',locked:false,results:[]};
const okMessages=['¡Excelente!','¡Muy bien!','¡Correcto!','¡Genial!','¡Eres un campeón de las fracciones!'];
const badMessages=['Sigue intentándolo.','Casi lo consigues.','Revisa la figura con atención.','No pasa nada, inténtalo de nuevo.','Seguro que la siguiente sale mejor.'];
const gcd=(a,b)=>b?gcd(b,a%b):a, rnd=a=>a[Math.floor(Math.random()*a.length)];
function svgEl(name,attrs={}){const e=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function createSVG(view='0 0 420 300'){const s=svgEl('svg',{viewBox:view,role:'img','aria-label':'Figura dividida en partes iguales'});return s}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}
function verifiedFraction(n,d,min,max){return Number.isInteger(n)&&Number.isInteger(d)&&d>=min&&d<=max&&n>0&&n<d&&gcd(n,d)===1}
function validateExercise(e){return e&&verifiedFraction(e.fraction.numerator,e.fraction.denominator,e.level==='basic'?2:4,e.level==='basic'?10:12)&&typeof renderers[e.renderer]==='function'&&e.key===`${e.level}-${e.renderer}-${e.fraction.numerator}-${e.fraction.denominator}-${e.variant}`}
function makeExercise(level,renderer,n,d,variant=0,difficulty=d){return{level,renderer,fraction:{numerator:n,denominator:d},variant,difficulty,key:`${level}-${renderer}-${n}-${d}-${variant}`}}
function generateExercises(level){const pool=[];if(level==='basic'){
 for(let d=2;d<=10;d++)for(let n=1;n<d;n++)if(gcd(n,d)===1){['circle','rect','bar','grid'].forEach((r,i)=>pool.push(makeExercise(level,r,n,d,i,d+n/d)))}
}else{
 for(let d=4;d<=12;d++)for(let n=1;n<d;n++)if(gcd(n,d)===1){
  // Solo figuras planas vistas de frente; se excluyen formas que puedan sugerir perspectiva.
  const types=['hiddenRect'];if(d>=5&&d<=10)types.push('polygon');if(d===6||d===12)types.push('hexagon');if(d===6)types.push('triangle');
  types.forEach((r,i)=>pool.push(makeExercise(level,r,n,d,i,d+n/d)))}
}
 const valid=pool.filter(validateExercise);valid.sort(()=>Math.random()-.5);const bands=[[],[],[],[],[]];valid.sort((a,b)=>a.difficulty-b.difficulty);valid.forEach((e,i)=>bands[Math.min(4,Math.floor(i*5/valid.length))].push(e));
 const chosen=[],used=new Set();for(const band of bands){let candidates=band.filter(e=>!used.has(e.key));if(!candidates.length)candidates=valid.filter(e=>!used.has(e.key));const e=rnd(candidates);chosen.push(e);used.add(e.key)}return chosen.sort((a,b)=>a.difficulty-b.difficulty);
}
function addTitle(svg,e){const t=svgEl('title');t.textContent=`${e.fraction.numerator} de ${e.fraction.denominator} partes iguales coloreadas`;svg.append(t)}
function renderLinear(e,opts={}){const s=createSVG(),{numerator:n,denominator:d}=e.fraction,x=45,y=85,w=330,h=130;addTitle(s,e);for(let i=0;i<d;i++){s.append(svgEl('rect',{x:x+i*w/d,y,width:w/d,height:h,fill:i<n?CONFIG.colors.fill:CONFIG.colors.empty,stroke:CONFIG.colors.line,'stroke-width':opts.hidden&&i>0&&i<d&&((i<n&&i-1<n)||(i>=n&&i-1>=n))?'0':'3'}))}if(opts.hidden){for(let i=1;i<d;i++)s.append(svgEl('line',{x1:x+i*w/d,y1:y-8,x2:x+i*w/d,y2:y+8,stroke:CONFIG.colors.line,'stroke-width':2}))}return s}
function renderCircle(e){const s=createSVG(),{numerator:n,denominator:d}=e.fraction,cx=210,cy=150,r=112;addTitle(s,e);for(let i=0;i<d;i++){const a1=-Math.PI/2+i*2*Math.PI/d,a2=-Math.PI/2+(i+1)*2*Math.PI/d;const path=`M ${cx} ${cy} L ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)} A ${r} ${r} 0 0 1 ${cx+r*Math.cos(a2)} ${cy+r*Math.sin(a2)} Z`;s.append(svgEl('path',{d:path,fill:i<n?CONFIG.colors.fill:CONFIG.colors.empty,stroke:CONFIG.colors.line,'stroke-width':3}))}return s}
function renderGrid(e){const s=createSVG(),{numerator:n,denominator:d}=e.fraction;addTitle(s,e);const cols=Math.ceil(Math.sqrt(d)),rows=Math.ceil(d/cols),size=Math.min(70,280/cols),ox=(420-cols*size)/2,oy=(300-rows*size)/2;for(let i=0;i<d;i++){const x=ox+(i%cols)*size,y=oy+Math.floor(i/cols)*size;s.append(svgEl('rect',{x,y,width:size,height:size,rx:5,fill:i<n?CONFIG.colors.fill:CONFIG.colors.empty,stroke:CONFIG.colors.line,'stroke-width':3}))}return s}
function renderPolygon(e){const s=createSVG(),{numerator:n,denominator:d}=e.fraction,cx=210,cy=150,r=120;addTitle(s,e);for(let i=0;i<d;i++){const a1=-Math.PI/2+i*2*Math.PI/d,a2=-Math.PI/2+(i+1)*2*Math.PI/d;const pts=`${cx},${cy} ${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)} ${cx+r*Math.cos(a2)},${cy+r*Math.sin(a2)}`;s.append(svgEl('polygon',{points:pts,fill:i<n?CONFIG.colors.fill:CONFIG.colors.empty,stroke:(i===0||i===n||i===d-1)?CONFIG.colors.line:'none','stroke-width':3}))}const outer=Array.from({length:d},(_,i)=>`${cx+r*Math.cos(-Math.PI/2+i*2*Math.PI/d)},${cy+r*Math.sin(-Math.PI/2+i*2*Math.PI/d)}`).join(' ');s.append(svgEl('polygon',{points:outer,fill:'none',stroke:CONFIG.colors.line,'stroke-width':4}));s.append(svgEl('circle',{cx,cy,r:5,fill:CONFIG.colors.line}));return s}
function renderTriangle(e){const s=createSVG(),{numerator:n,denominator:d}=e.fraction;addTitle(s,e);const cx=210,cy=170,r=125;for(let i=0;i<6;i++){const a1=-Math.PI/2+i*Math.PI/3,a2=-Math.PI/2+(i+1)*Math.PI/3;s.append(svgEl('polygon',{points:`${cx},${cy} ${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)} ${cx+r*Math.cos(a2)},${cy+r*Math.sin(a2)}`,fill:i<n?CONFIG.colors.fill:CONFIG.colors.empty,stroke:(i===0||i===n||i===5)?CONFIG.colors.line:'none','stroke-width':3}))}return s}
function renderTrapezoid(e){const s=createSVG(),{numerator:n,denominator:d}=e.fraction,top=170,bottom=330,h=150,x0=45,y0=75;addTitle(s,e);const area=(top+bottom)*h/2;const widthAt=y=>top+(bottom-top)*y/h;const partial=y=>top*y+(bottom-top)*y*y/(2*h);const ys=[0];for(let k=1;k<d;k++){let lo=0,hi=h;for(let z=0;z<35;z++){const m=(lo+hi)/2;partial(m)<area*k/d?lo=m:hi=m}ys.push((lo+hi)/2)}ys.push(h);for(let i=0;i<d;i++){const ya=ys[i],yb=ys[i+1],wa=widthAt(ya),wb=widthAt(yb);const pts=`${210-wa/2},${y0+ya} ${210+wa/2},${y0+ya} ${210+wb/2},${y0+yb} ${210-wb/2},${y0+yb}`;s.append(svgEl('polygon',{points:pts,fill:i<n?CONFIG.colors.fill:CONFIG.colors.empty,stroke:(i===0||i===n||i===d-1)?CONFIG.colors.line:'none','stroke-width':3}))}s.append(svgEl('polygon',{points:`${210-top/2},${y0} ${210+top/2},${y0} ${210+bottom/2},${y0+h} ${210-bottom/2},${y0+h}`,fill:'none',stroke:CONFIG.colors.line,'stroke-width':4}));for(let i=1;i<d;i++){const y=ys[i],w=widthAt(y);s.append(svgEl('line',{x1:210-w/2-7,y1:y0+y,x2:210-w/2+7,y2:y0+y,stroke:CONFIG.colors.line,'stroke-width':2}))}return s}
const renderers={circle:renderCircle,rect:e=>renderLinear(e),bar:e=>renderLinear(e),grid:renderGrid,hiddenRect:e=>renderLinear(e,{hidden:true}),polygon:renderPolygon,hexagon:renderPolygon,triangle:renderTriangle,trapezoid:renderTrapezoid};
function renderCover(){const e=makeExercise('basic','circle',3,5,0,1),s=renderCircle(e);s.setAttribute('viewBox','0 0 420 330');s.setAttribute('preserveAspectRatio','xMidYMid meet');const stars=svgEl('g');[[45,52],[365,45],[55,250],[355,240]].forEach(([x,y])=>{const t=svgEl('text',{x,y,'font-size':34,fill:'#f72585'});t.textContent='★';stars.append(t)});s.append(stars);return s}
function start(level){state.level=level;state.exercises=generateExercises(level);state.index=state.score=state.errors=0;state.results=[];show('game');loadExercise()}
function loadExercise(){state.answer={numerator:'',denominator:''};state.active='numerator';state.locked=false;$('#feedback').textContent='';$('#feedback').className='feedback';$('#next').hidden=true;$('#levelPill').textContent=state.level==='basic'?'Nivel básico':'Nivel avanzado';$('#scorePill').textContent=`Puntos: ${state.score}`;$('#progressBar').style.width=`${state.index/5*100}%`;const e=state.exercises[state.index];$('#figure').replaceChildren(renderers[e.renderer](e));updateSlots()}
function updateSlots(){$('#numSlot').textContent=state.answer.numerator||' ';$('#denSlot').textContent=state.answer.denominator||' ';$('#numSlot').classList.toggle('active',state.active==='numerator');$('#denSlot').classList.toggle('active',state.active==='denominator')}
function inputKey(k){if(state.locked)return;if(/^\d$/.test(k)){let v=state.answer[state.active];if(v.length<2&&!(v===''&&k==='0'))state.answer[state.active]=v+k}else if(k==='→')state.active='denominator';else if(k==='←')state.active='numerator';else if(k==='⌫')state.answer[state.active]=state.answer[state.active].slice(0,-1);updateSlots()}
function check(){if(state.locked)return;const n=Number(state.answer.numerator),d=Number(state.answer.denominator);if(!state.answer.numerator||!state.answer.denominator||d===0){$('#feedback').textContent='Completa las dos casillas con un denominador distinto de cero.';$('#feedback').className='feedback bad';return}const e=state.exercises[state.index],correct=n===e.fraction.numerator&&d===e.fraction.denominator;state.locked=true;if(correct)state.score++;else state.errors++;state.results.push({exercise:e,answer:{numerator:n,denominator:d},correct});$('#feedback').textContent=rnd(correct?okMessages:badMessages);$('#feedback').className='feedback '+(correct?'ok':'bad');$('#scorePill').textContent=`Puntos: ${state.score}`;$('#next').hidden=false}
function next(){state.index++;if(state.index===5)finish();else loadExercise()}
function finish(){show('results');$('#hits').textContent=state.score;$('#errors').textContent=state.errors;const p=Math.round(state.score/5*100);$('#percent').textContent=p+'%';$('#motivation').textContent=p===100?'¡Dominio total! Identificas las fracciones con precisión.':p>=80?'¡Muy buen resultado! Solo queda pulir algún detalle.':p>=60?'Vas por buen camino. Revisa las divisiones ocultas y vuelve a intentarlo.':'Conviene repasar cómo se cuentan las partes iguales y las coloreadas.';const list=$('#resultList');list.replaceChildren();state.results.forEach((r,i)=>{const row=document.createElement('div');row.className='result-row';const thumb=document.createElement('div');thumb.className='thumb';thumb.append(renderers[r.exercise.renderer](r.exercise));row.append(thumb);row.insertAdjacentHTML('beforeend',`<div><strong>Tu respuesta</strong><br>${r.answer.numerator}/${r.answer.denominator}</div><div><strong>Solución</strong><br>${r.exercise.fraction.numerator}/${r.exercise.fraction.denominator}</div><div class="status ${r.correct?'good':'wrong'}">${r.correct?'✓ Correcto':'✗ Incorrecto'}</div>`);list.append(row)});$('#progressBar').style.width='100%'}
function init(){const keypad=$('#keypad');['1','2','3','4','5','6','7','8','9','←','0','→','⌫'].forEach(k=>{const b=document.createElement('button');b.type='button';b.className='key '+(/[←→]/.test(k)?'arrow ':'')+(k==='⌫'?'clear':'');b.textContent=k;b.setAttribute('aria-label',k==='←'?'Volver al numerador':k==='→'?'Pasar al denominador':k==='⌫'?'Borrar':k);b.addEventListener('click',()=>inputKey(k));keypad.append(b)});const c=document.createElement('button');c.type='button';c.className='btn primary check';c.textContent='Comprobar';c.addEventListener('click',check);keypad.append(c);$('#cover').append(window[CONFIG.coverRenderer]());document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.level)));$('#next').addEventListener('click',next);$('#quit').addEventListener('click',()=>show('home'));$('#replay').addEventListener('click',()=>start(state.level));$('#other').addEventListener('click',()=>show('home'));$('#homeBtn').addEventListener('click',()=>show('home'))}
init();
</script></body></html>
