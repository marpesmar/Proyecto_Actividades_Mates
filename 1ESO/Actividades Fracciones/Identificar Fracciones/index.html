<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>¿Qué fracción soy?</title>

<style>
:root {
  --ink: #17324d;
  --blue: #4361ee;
  --cyan: #4cc9f0;
  --pink: #f72585;
  --yellow: #ffd166;
  --green: #2fb344;
  --orange: #f08c00;
  --paper: #fff;
  --muted: #64748b;
  --shadow: 0 16px 40px #25385822;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 10% 10%, #fff7cc 0 12%, transparent 13%),
    radial-gradient(circle at 90% 15%, #d8f5ff 0 13%, transparent 14%),
    linear-gradient(145deg, #f7fbff, #fdf6ff);
}

button {
  font: inherit;
}

.app {
  width: min(1080px, 100%);
  margin: auto;
  padding: 20px;
}

.screen {
  display: none;
  animation: fade 0.3s ease;
}

.screen.active {
  display: block;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}

.card {
  padding: clamp(18px, 4vw, 36px);
  background: #fffc;
  border: 1px solid #fff;
  border-radius: 28px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}

/* Portada */
.hero {
  text-align: center;
}

.hero h1 {
  margin: 0.1em 0;
  color: var(--blue);
  font-size: clamp(2.2rem, 7vw, 4.8rem);
  letter-spacing: -0.04em;
}

.hero p {
  margin: 0.2em 0 1em;
  color: #52657a;
  font-size: clamp(1rem, 2.7vw, 1.35rem);
}

/*
  La ilustración tiene una zona propia y no puede superponerse
  con el título de la aplicación.
*/
.cover {
  display: grid;
  place-items: center;
  width: 100%;
  max-width: 620px;
  height: 190px;
  margin: 6px auto 28px;
  overflow: hidden;
}

.cover svg {
  display: block;
  width: 100%;
  height: 100%;
  max-height: 190px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
}

.btn {
  min-height: 52px;
  padding: 15px 22px;
  border: 0;
  border-radius: 18px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 0 #0002;
  transition: transform 0.15s, filter 0.15s;
}

.btn:hover {
  filter: brightness(1.04);
  transform: translateY(-2px);
}

.btn:active {
  box-shadow: 0 4px 0 #0002;
  transform: translateY(4px);
}

.btn:focus-visible,
.key:focus-visible {
  outline: 4px solid #1118;
  outline-offset: 3px;
}

.basic {
  color: #07334a;
  background: var(--cyan);
}

.advanced {
  color: white;
  background: var(--pink);
}

.secondary {
  color: var(--ink);
  background: #e9eef6;
}

.primary {
  color: white;
  background: var(--blue);
}

.next {
  color: #5c3b00;
  background: var(--yellow);
}

/* Cabecera del juego */
.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.pill {
  padding: 9px 14px;
  background: white;
  border-radius: 999px;
  font-weight: 800;
}

.progress {
  flex: 1;
  min-width: 160px;
  height: 14px;
  overflow: hidden;
  background: #e5eaf1;
  border-radius: 999px;
}

.progress > div {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--blue));
  transition: width 0.3s;
}

/* Zona de juego */
.gamegrid {
  display: grid;
  grid-template-columns: minmax(270px, 1.3fr) minmax(270px, 0.8fr);
  gap: 22px;
}

.figurebox {
  display: grid;
  place-items: center;
  min-height: 380px;
  padding: 14px;
  background: linear-gradient(145deg, #fff, #f4f8ff);
  border: 3px dashed #cad7e6;
  border-radius: 24px;
}

.figurebox svg {
  width: 100%;
  max-height: 360px;
}

.panel {
  text-align: center;
}

.panel h2 {
  margin: 0.2em;
  font-size: clamp(1.5rem, 4vw, 2.2rem);
}

/* Entrada de la fracción */
.fraction {
  display: inline-grid;
  grid-template-rows: auto 5px auto;
  gap: 7px;
  width: 105px;
  margin: 6px auto 14px;
}

.slot {
  display: grid;
  place-items: center;
  height: 58px;
  overflow: hidden;
  background: #fff;
  border: 3px solid #b7c4d3;
  border-radius: 12px;
  font-size: 2rem;
  font-weight: 900;
}

.slot.active {
  border-color: var(--blue);
  box-shadow: 0 0 0 5px #4361ee24;
}

.bar {
  background: var(--ink);
  border-radius: 4px;
}

/* Teclado */
.keypad {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  max-width: 330px;
  margin: auto;
}

.key {
  min-height: 48px;
  background: #fff;
  border: 0;
  border-radius: 13px;
  box-shadow: 0 4px 0 #d5dce7;
  font-size: 1.2rem;
  font-weight: 900;
  cursor: pointer;
}

.key.arrow {
  color: #263da2;
  background: #dfe6ff;
}

.key.clear {
  color: #9b1c1c;
  background: #ffe0e0;
}

.check {
  grid-column: 1 / -1;
  margin-top: 7px;
}

.feedback {
  min-height: 54px;
  margin: 14px 0 4px;
  font-size: 1.08rem;
  font-weight: 900;
}

.feedback.ok {
  color: var(--green);
}

.feedback.bad {
  color: var(--orange);
}

/* Resultados */
.results h1 {
  text-align: center;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 18px 0;
}

.stat {
  padding: 18px;
  background: #f0f5ff;
  border-radius: 20px;
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 2rem;
}

.result-list {
  display: grid;
  gap: 10px;
}

.result-row {
  display: grid;
  grid-template-columns: 80px 1fr 1fr 1fr;
  align-items: center;
  gap: 8px;
  padding: 8px;
  background: #f7f9fc;
  border-radius: 16px;
}

.thumb svg {
  width: 70px;
  height: 56px;
}

.good {
  color: var(--green);
  font-weight: 900;
}

.wrong {
  color: #d9480f;
  font-weight: 900;
}

.motivation {
  color: var(--blue);
  font-size: 1.2rem;
  font-weight: 800;
  text-align: center;
}

/* Adaptación a móviles */
@media (max-width: 720px) {
  .gamegrid {
    grid-template-columns: 1fr;
  }

  .figurebox {
    min-height: 280px;
  }

  .result-row {
    grid-template-columns: 62px 1fr 1fr;
  }

  .result-row .status {
    grid-column: 2 / -1;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .app {
    padding: 10px;
  }

  .card {
    border-radius: 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
